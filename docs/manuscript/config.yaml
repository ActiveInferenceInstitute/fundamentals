# Template-format manuscript configuration for fundamentals.


paper:
  title: "Fundamentals of Active Inference: Python Companion"
  subtitle: "Reproducing textbook methods with executable Python examples and verified artifacts"
  version: "0.1.0"
  date: ""

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  doi: ""
  version_doi: ""
  version_record: ""
  repository_url: "https://github.com/ActiveInferenceInstitute/fundamentals"
  release_status: "unreleased"
  year: "2026"
  transmission_bookends:
    enabled: false
    max_prior_releases: 5
    show_steganography: false

keywords:
  - "active inference"
  - "textbook companion"
  - "Python examples"
  - "source spine"
  - "reproducible figures"

metadata:
  license: "MIT"
  language: "en"

manuscript_dir: "docs/manuscript"

render:
  # The project renderer (scripts/render_manuscript.py) produces html and pdf.
  # A format enabled here must be one it produces, or the render is refused.
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false

bibliography:
  references_path: "docs/manuscript/references.bib"
  fail_on_missing: true
  fail_on_unused: false
