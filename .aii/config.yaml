# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-10'
repo:
  name: fundamentals
  slug: fundamentals
  full_name: ActiveInferenceInstitute/fundamentals
  description: Unofficial repo for materials and code related to "Fundamentals of
    Active Inference" (Namjoshi 2026).
institute:
  category: education
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  links:
    github: https://github.com/ActiveInferenceInstitute/fundamentals
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent and contributor conventions.
- path: src
  kind: code
  description: Library source tree (`active_inference`).
- path: chapters
  kind: code
  description: Thin chapter orchestrators for Chapters 1-14.
- path: extras
  kind: code
  description: Cross-cutting extras topic orchestrators from the extra-topics registry.
- path: demo
  kind: code
  description: Application demos (eye saccades, bicycle, drone flight).
- path: specs
  kind: doc
  description: GNN declaration of the Chapter 9 weather model and its upstream parser
    pin.
- path: tests
  kind: code
  description: pytest suite — unit, contract, and chapter/extras/demo smoke tests.
- path: docs
  kind: doc
  description: Documentation hub, including the GNN adoption page and reference pages.
- path: scripts
  kind: code
  description: Batch renderers and artifact validators, including the pinned GNN conformance
    validator.
- path: output
  kind: data
  description: Generated figures, raw-data sidecars, and notebooks (gitignored, regenerable).
- path: manuscript
  kind: doc
  description: Manuscript scaffold describing the companion's artifacts and evidence.
- path: pyproject.toml
  kind: code
  description: Python package config.
- path: LICENSE
  kind: doc
  description: License.
provenance:
  license: MIT
  citation:
    text: Active Inference Institute — fundamentals.
instituteos:
  tags:
  - fundamentals
  - education
  - materials
  - python
capabilities:
- python-package
- tested
- documentation
- ci
- manuscript-publication
tasks:
  test:
    cmd: python -m pytest
    description: Run the test suite.
docs:
- README.md
- AGENTS.md
- docs/INTEGRATION.md
- docs/README.md
- docs/AGENTS.md
schema: aii-sidecar/v1
