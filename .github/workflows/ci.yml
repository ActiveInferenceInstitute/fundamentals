name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# The workflow only reads the repository; every job installs and runs code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs the shared composite setup step once and then invokes one
# arm of ./gate.sh. The gate owns each command, so a job never restates a
# command that runs elsewhere, and a local `./gate.sh <arm>` runs exactly what
# CI runs. See docs/gate.md for the arm list and the measured arm times.
#
# The gate exports MPLBACKEND=Agg for headless runs; it is not repeated here.

jobs:
  # Ruff on the tree once. It used to run in both matrix legs.
  lint:
    timeout-minutes: 30
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.14"

      - name: Install the locked environment
        run: uv sync --locked --python 3.14

      - name: Lint
        run: ./gate.sh lint

  # The unit, contract, and documentation suites on the interpreter floor
  # declared in pyproject.toml (3.11) and on the newest interpreter the
  # committed lock installs on (3.14).
  #
  # Python 3.15 is deliberately not a leg: the locked dependency set publishes no
  # cp315 wheels yet — PyYAML 6.0.3 (now a dev requirement of the manuscript
  # renderer) stops at cp314, and rpds-py 0.30.0 (through nbformat -> jsonschema)
  # would need a Rust build — so `uv sync --locked` cannot install here. The leg
  # returns when the wheels exist; pyproject.toml still declares support for 3.11
  # and newer.
  #
  # `tests/test_gnn_spec.py` runs the drift guard, the posterior oracle, and the
  # reader's rejection cases here; its pinned-parser case needs a runtime and is
  # covered by the `gnn conformance` job below.
  tests:
    timeout-minutes: 120
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Unit and repository contract tests
        run: ./gate.sh fast

  # The repository validators plus the manuscript contract check on one
  # interpreter. The validators are static or read the tracked artifact sample,
  # so they need no render: the orchestrator contract and provenance gates cover
  # all chapter/extras/demo scripts, the book-topic gate covers the extras
  # registry and matrix, the source-spine gate covers the inspected ledger (the
  # machine-local PDF form stays local), and the rendered-media gate checks the
  # tracked sample under output/figures/. `manuscript-check` validates the
  # declared variables, the figure registry, citations, and section labels
  # without needing Pandoc or TeX; `validate_raw_data_exports.py` needs generated
  # sidecars, which are gitignored, and the full smoke suite renders every
  # orchestrator in a temporary root; both stay local (see scripts/README.md).
  validators:
    timeout-minutes: 120
    name: repository validators
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.14"

      - name: Install the locked environment
        run: uv sync --locked --python 3.14

      - name: Repository validators
        run: ./gate.sh validators

      - name: Manuscript contract
        run: ./gate.sh manuscript-check

  # Required check: validates specs/weather_pomdp.gnn.md with the parser
  # revision pinned in specs/gnn-pin.json, digest-verifying the installed parser
  # files before parsing, and re-runs tests/test_gnn_spec.py with that runtime so
  # the pinned-parser case executes instead of skipping. The gate provisions the
  # pinned runtime on Python 3.12 in its own environment under GATE_CACHE; it
  # never becomes a skip.
  gnn-conformance:
    timeout-minutes: 120
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.14"

      - name: Install the locked environment
        run: uv sync --locked --python 3.14

      - name: Pinned GNN conformance
        env:
          # Keep the provisioned pinned runtime on the runner, not in the checkout.
          GATE_CACHE: ${{ runner.temp }}/gate-cache
        run: ./gate.sh gnn
